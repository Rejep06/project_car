services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscriptions"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - support_uploads:/app/uploads/support
    depends_on:
      db:
        condition: service_healthy

  deposit-worker:
    build: .
    env_file: .env
    command: python -m app.workers.deposit_worker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  reward-worker:
    build: .
    env_file: .env
    command: python -m app.workers.reward_worker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  support_uploads:
